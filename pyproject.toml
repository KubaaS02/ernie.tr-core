[project]
name = "earnie-tr-core"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "mypy>=1.19.1",
    "poethepoet>=0.40.0",
    "pytest>=9.0.2",
    "requests>=2.32.5",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
models = ["py.typed"]
core = ["py.typed"]
exceptions = ["py.typed"

[tool.mypy]
python_version = "3.14"
pretty = true
show_error_codes = true
warn_unused_ignores = true

[tools.poethepoet.tasks]
test = "pytest tests"

#[mypy]
#ignore_missing_imports = True