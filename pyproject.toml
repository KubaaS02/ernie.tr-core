[project]
name = "earnie-tr-core"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "mypy>=1.19.1",
    "poethepoet>=0.40.0",
    "pydantic>=2.13.5",
    "pytest>=9.0.2",
    "requests>=2.32.5",
    "sqlalchemy[asyncio]>=2.0.54",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
models = ["py.typed"]
core = ["py.typed"]
exceptions = ["py.typed"]
salary = ["py.typed"]
helper = ["py.typed"]

[tool.mypy]
python_version = "3.14"
pretty = true
show_error_codes = true
warn_unused_ignores = true

[tools.poethepoet.tasks]
test = "pytest tests"

[dependency-groups]
dev = [
    "types-requests>=2.33.0.20260712",
]

#[mypy]
#ignore_missing_imports = True